<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sessions</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/markdown.js" defer></script>
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Sessions</h1>
        <p class="subtitle">
          Claude, Codex, and Kimi
          <span aria-hidden="true">·</span>
          <strong id="total-stat">—</strong> sessions across <strong id="projects-stat">—</strong> projects
          <span aria-hidden="true">·</span>
          <strong id="active-stat">—</strong> active
        </p>
      </div>
      <div class="refresh-controls">
        <span id="refresh-status" class="refresh-status">Loading sessions…</span>
        <button id="refresh-button" class="button button-secondary" type="button">Refresh</button>
      </div>
    </header>

    <section class="controls" aria-label="Session controls">
      <div class="tabs" role="group" aria-label="Filter by activity">
        <button class="tab selected" type="button" data-status="all" aria-pressed="true">All</button>
        <button class="tab" type="button" data-status="active" aria-pressed="false">Active</button>
        <button class="tab" type="button" data-status="past" aria-pressed="false">Past</button>
      </div>
      <div class="toolbar-actions">
        <label class="search-field">
          <span class="sr-only">Search sessions</span>
          <input id="search-input" type="search" placeholder="Search sessions" title="Search prompts, folders, models, or IDs" autocomplete="off">
        </label>
        <span id="results-count" class="results-count" hidden></span>
        <details id="advanced-filters" class="advanced-filters">
          <summary>Filters</summary>
          <div class="filter-options">
            <label class="filter-field">
              <span>Source</span>
              <select id="source-filter">
                <option value="all">All sources</option>
                <option value="claude">Claude</option>
                <option value="codex">Codex</option>
                <option value="kimi">Kimi</option>
              </select>
            </label>
            <label class="filter-field project-field">
              <span>Project folder</span>
              <select id="project-filter">
                <option value="all">All project folders</option>
              </select>
            </label>
            <button id="clear-button" class="button button-quiet" type="button" hidden>Clear filters</button>
          </div>
        </details>
      </div>
    </section>

    <section class="workspace" aria-label="Session browser">
      <div id="session-list" class="session-list" aria-live="polite" aria-busy="true"></div>
      <div id="empty-state" class="empty-state" hidden>
        <h2>No sessions found</h2>
        <p>Try another search or clear the filters.</p>
      </div>
      <div id="loading-state" class="loading-state">
        <span class="loading-line"></span>
        <span class="loading-line"></span>
        <span class="loading-line"></span>
      </div>
    </section>

    <footer class="footer">
      <span>Active means updated within <strong id="active-window">15</strong> minutes.</span>
      <span>Refreshes automatically every 60 seconds.</span>
    </footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
