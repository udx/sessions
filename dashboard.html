<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sessions</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/markdown.js" defer></script>
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Filters">
      <h1 class="wordmark">sessions</h1>

      <dl class="stats">
        <div class="stat">
          <dt>Sessions</dt>
          <dd id="total-stat">0</dd>
        </div>
        <div class="stat">
          <dt>Projects</dt>
          <dd id="projects-stat">0</dd>
        </div>
        <div class="stat stat-active">
          <dt>Active</dt>
          <dd id="active-stat">0</dd>
        </div>
      </dl>

      <nav class="rail-group" aria-label="Filter by agent">
        <h2 class="rail-label">Agents</h2>
        <div id="source-list" class="rail-list"></div>
      </nav>

      <nav class="rail-group rail-projects" aria-label="Filter by project">
        <h2 class="rail-label">Projects</h2>
        <div id="project-list" class="rail-list"></div>
      </nav>

      <p class="rail-note">Active means updated within <span id="active-window">15</span> minutes. Refreshes automatically every 60 seconds.</p>
    </aside>

    <main class="main">
      <header class="toolbar" aria-label="Session controls">
        <div class="tabs" role="group" aria-label="Filter by activity">
          <button class="tab selected" type="button" data-status="all" aria-pressed="true">All</button>
          <button class="tab" type="button" data-status="active" aria-pressed="false">Active</button>
          <button class="tab" type="button" data-status="past" aria-pressed="false">Past</button>
        </div>
        <label class="search-field">
          <span class="sr-only">Search sessions</span>
          <input id="search-input" type="search" placeholder="Search" title="Search prompts, folders, models, or IDs" autocomplete="off">
        </label>
        <span id="results-count" class="results-count" hidden></span>
        <button id="clear-button" class="button" type="button" hidden>Clear filters</button>
        <div class="refresh-controls">
          <span id="refresh-status" class="refresh-status">Reading sessions</span>
          <button id="refresh-button" class="button button-secondary" type="button">Refresh</button>
        </div>
      </header>

      <section class="workspace" aria-label="Session browser">
        <div class="list-head" aria-hidden="true">
          <span class="head-session">Session</span>
          <span class="cell-project">Project</span>
          <span class="cell-count">Messages</span>
          <span class="cell-activity">7 days</span>
          <span class="cell-time">Last active</span>
          <span class="cell-action"></span>
        </div>
        <div id="session-list" class="session-list" aria-live="polite" aria-busy="true"></div>
        <div id="empty-state" class="empty-state" hidden>
          <h2>No sessions found</h2>
          <p>Try another search or clear the filters</p>
        </div>
        <div id="loading-state" class="loading-state">Reading session files</div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
